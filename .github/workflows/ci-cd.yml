name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install

    - name: Run i18n string extraction and validation
      working-directory: ./frontend
      run: npm run extract
      # The parser can be configured to fail if there are missing translations or syntax issues.
      # For now, we make sure the extraction command runs successfully.

    - name: Install Playwright Browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps

    - name: Run E2E Tests (Playwright)
      working-directory: ./frontend
      run: npx playwright test

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build Backend (Maven)
      working-directory: ./backend
      run: mvn clean package -DskipTests

    - name: Run Backend Tests
      working-directory: ./backend
      run: mvn test

    - name: Verify Docker Compose Build
      run: docker-compose build
